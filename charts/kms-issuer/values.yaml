# Default values for kms-issuer.

replicaCount: 1

image:
  repository: ghcr.io/sunsofterp/kms-issuer
  # -- Image digest (sha256:...). When set, the image is pulled by digest and the tag
  # is ignored. Set it for anything that matters: tags can move.
  digest: ""
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Required. The AWS region of the KMS key.
awsRegion: ""

args:
  # -- Required. Namespaces a KMSIssuer may live in; KMSIssuers anywhere else sign
  # nothing. Keep these namespaces to platform administrators.
  allowedIssuerNamespaces: []
  # -- Required. KMS key IDs or ARNs (never aliases) a KMSIssuer may sign with.
  allowedKeyIds: []
  # -- Run the KMSKey controller, which creates and deletes KMS keys. Off: create
  # keys outside the cluster and grant the controller only kms:Sign and
  # kms:GetPublicKey on them.
  enableKMSKeyController: false
  # -- The address the metrics endpoint binds to ("0" disables it).
  metricsBindAddress: :8443
  # -- Serve metrics over HTTPS to authenticated, authorized callers only.
  metricsSecure: true
  # -- Enable leader election for controller manager.
  leaderElect: true
  # -- The address the probe endpoint binds to
  healthProbeBindAddress: :8081
  # -- Test only: a local KMS endpoint, used with static test credentials.
  localAwsEndpoint: ""

# -- Extra environment variables for the controller.
env: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Lets cert-manager's built-in approver approve every request for KMSIssuers. Off:
# approve requests with a policy approver (cert-manager approver-policy) instead,
# so approval means something. The controller enforces its own policy either way.
certManagerApprovalRBAC:
  # -- Grant cert-manager's service account approval rights over all KMSIssuers.
  enable: false
  # -- The service account name that cert-manager is using
  serviceAccountName: cert-manager
  # -- The namespace where cert-manager service account is deployed
  namespace: cert-manager

podAnnotations: {}

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}

tolerations: []

affinity: {}

podDisruptionBudget:
  enable: false
  minAvailable: 1
  maxUnavailable: ""
