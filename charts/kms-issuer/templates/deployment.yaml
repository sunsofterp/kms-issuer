{{- $namespaces := required "args.allowedIssuerNamespaces is required" .Values.args.allowedIssuerNamespaces }}
{{- $keys := required "args.allowedKeyIds is required" .Values.args.allowedKeyIds }}
{{- $region := required "awsRegion is required" .Values.awsRegion }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kms-issuer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: {{ include "kms-issuer.fullname" . }}-controller-manager
    {{- include "kms-issuer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      control-plane: {{ include "kms-issuer.fullname" . }}-controller-manager
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        control-plane: {{ include "kms-issuer.fullname" . }}-controller-manager
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - command:
        - /manager
        - --allowed-issuer-namespaces={{ join "," $namespaces }}
        - --allowed-key-ids={{ join "," $keys }}
        - --enable-kmskey-controller={{ .Values.args.enableKMSKeyController }}
        - --health-probe-bind-address={{ .Values.args.healthProbeBindAddress }}
        - --metrics-bind-address={{ .Values.args.metricsBindAddress }}
        - --metrics-secure={{ .Values.args.metricsSecure }}
        - --leader-elect={{ .Values.args.leaderElect }}
        {{- with .Values.args.localAwsEndpoint }}
        - --local-aws-endpoint={{ . }}
        {{- end }}
        {{- if .Values.image.digest }}
        image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
        {{- else }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        {{- end }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: AWS_REGION
          value: {{ $region | quote }}
        {{- with .Values.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - containerPort: {{ (split ":" .Values.args.metricsBindAddress)._1 | default 8443 }}
          name: https
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ (split ":" .Values.args.healthProbeBindAddress)._1 }}
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ (split ":" .Values.args.healthProbeBindAddress)._1 }}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        volumeMounts:
        # Writable scratch space with a read-only root filesystem (the metrics
        # server writes its self-signed certificate here).
        - name: tmp
          mountPath: /tmp
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "kms-issuer.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
