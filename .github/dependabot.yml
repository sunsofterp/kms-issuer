version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
  # The Dockerfile's base images (Go, distroless), pinned by digest
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
