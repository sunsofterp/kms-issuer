name: Release artifacts

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  # Nothing is published unless the released commit passes the tests and the
  # vulnerability check.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Vulnerability check
        run: make vulncheck

  # kms-ca, the tool administrators run with the root key: built from the released
  # commit, with checksums and a keyless cosign signature, attached to the release.
  # Verify before use (README, "Making the CA").
  kms-ca:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload to the release
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            if [ "${os}" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS=${os} GOARCH=${arch} go build -trimpath -o "dist/kms-ca-${os}-${arch}${ext}" ./cmd/kms-ca
          done
          (cd dist && sha256sum kms-ca-* > SHA256SUMS)
      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}"

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{raw}}

      - name: Login to GitHub Packages
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish a docker image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign the image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"

      - name: Record the digest to pin
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Image digest (pin this in the chart's image.digest): ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  helm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Helm
        uses: Azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Login to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: echo "${TOKEN}" | helm registry login ghcr.io -u "${OWNER}" --password-stdin

      - name: Package and push Helm chart
        id: push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          helm package charts/kms-issuer
          helm push kms-issuer-*.tgz "oci://ghcr.io/${OWNER}/charts" 2>&1 | tee push.txt
          digest=$(grep -o 'sha256:[0-9a-f]\{64\}' push.txt | head -n1)
          test -n "${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Log cosign in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: echo "${TOKEN}" | cosign login ghcr.io -u "${OWNER}" --password-stdin

      - name: Sign the chart by digest
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${OWNER}/charts/kms-issuer@${DIGEST}"
