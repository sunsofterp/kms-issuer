name: E2E Tests

# The controller installed with its Helm chart (the real install path) in kind,
# against local-kms: an issuer signs a certificate inside its domains, refuses one
# outside them, and the KMSKey controller creates and schedules deletion of a key.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      IMG: kms-issuer:ci
      CERT_MANAGER_VERSION: v1.21.3
      # sha256 of that release's cert-manager.yaml; change with the version.
      CERT_MANAGER_SHA256: c04a51295adda2b1a775146751f973e787190778c7f35180861d9678876e5c74
      KMS: http://localhost:8080
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: Azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Build the testing kms-issuer docker image
        run: docker build -t "${IMG}" .

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: kind
      - name: Load test docker image into the kind cluster
        run: kind load docker-image "${IMG}"

      - name: Install local-kms
        run: |
          kubectl create namespace local-kms
          kubectl create deployment local-kms -n local-kms --port 8080 \
            --image nsmithuk/local-kms:3.11.2@sha256:94887e8d85286886423c9cb0b39015c886a109c6d6e41f54633a27a2dce3a1b1
          kubectl expose deployment local-kms -n local-kms --port 8080
          kubectl wait --for=condition=Available deployment/local-kms -n local-kms --timeout=120s
          kubectl port-forward -n local-kms svc/local-kms 8080 &
          sleep 3

      - name: Install cert-manager (checksum-verified manifest)
        run: |
          curl -sSLo cert-manager.yaml "https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.yaml"
          echo "${CERT_MANAGER_SHA256}  cert-manager.yaml" | sha256sum -c -
          kubectl apply -f cert-manager.yaml
          kubectl wait --for=condition=Available deployment --all -n cert-manager --timeout=180s

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Create the root and issuing keys in local-kms
        id: key
        run: |
          new_key() {
            aws --endpoint "${KMS}" kms create-key --region eu-west-1 --no-sign-request \
              --key-usage SIGN_VERIFY --key-spec RSA_3072 | jq -er '.KeyMetadata.KeyId'
          }
          echo "root_key_id=$(new_key)" >> "$GITHUB_OUTPUT"
          echo "key_id=$(new_key)" >> "$GITHUB_OUTPUT"

      - name: Make the root and the intermediate with kms-ca
        env:
          ROOT_KEY_ID: ${{ steps.key.outputs.root_key_id }}
          KEY_ID: ${{ steps.key.outputs.key_id }}
        run: |
          # A test build: only it has --aws-endpoint.
          go build -tags kmsca_test_endpoint -o kms-ca ./cmd/kms-ca
          ./kms-ca root --aws-endpoint "${KMS}" --key-id "${ROOT_KEY_ID}" \
            --common-name "E2E Root" --domains example.internal --out root.pem
          ./kms-ca intermediate --aws-endpoint "${KMS}" --root-key-id "${ROOT_KEY_ID}" --root-certificate root.pem \
            --key-id "${KEY_ID}" --common-name "E2E Issuing" --domains example.internal --out intermediate.pem

      # cert-manager's built-in approver is allowed to approve here only to keep the
      # test short; production uses a policy approver.
      - name: Install kms-issuer with its chart
        env:
          KEY_ID: ${{ steps.key.outputs.key_id }}
        run: |
          helm install kms-issuer charts/kms-issuer -n kms-issuer-system --create-namespace --wait \
            --set image.repository=kms-issuer --set image.tag=ci --set image.allowTag=true --set image.pullPolicy=Never \
            --set awsRegion=eu-west-1 \
            --set-file rootCertificate=root.pem \
            --set "args.allowedIssuerNamespaces={default}" \
            --set "args.allowedKeyIds={${KEY_ID}}" \
            --set "args.permittedDNSDomains={example.internal}" \
            --set args.enableKMSKeyController=true \
            --set args.localAwsEndpoint=http://local-kms.local-kms:8080 \
            --set certManagerApprovalRBAC.enable=true \
            --set "certManagerApprovalRBAC.issuers={default.kms-issuer-sample}"

      - name: Create a KMSIssuer
        env:
          KEY_ID: ${{ steps.key.outputs.key_id }}
        run: |
          {
            echo "apiVersion: cert-manager.skyscanner.net/v1alpha1"
            echo "kind: KMSIssuer"
            echo "metadata: {name: kms-issuer-sample, namespace: default}"
            echo "spec:"
            echo "  keyId: ${KEY_ID}"
            echo "  permittedDNSDomains: [example.internal]"
            echo "  intermediateCertificate: |"
            sed 's/^/    /' intermediate.pem
          } | kubectl apply -f -
          kubectl wait --for=condition=Ready kmsissuer/kms-issuer-sample --timeout=60s

      - name: An issuer naming the root key (not an allowed key) never becomes ready
        env:
          ROOT_KEY_ID: ${{ steps.key.outputs.root_key_id }}
        run: |
          {
            echo "apiVersion: cert-manager.skyscanner.net/v1alpha1"
            echo "kind: KMSIssuer"
            echo "metadata: {name: root-as-issuer, namespace: default}"
            echo "spec:"
            echo "  keyId: ${ROOT_KEY_ID}"
            echo "  permittedDNSDomains: [example.internal]"
            echo "  intermediateCertificate: |"
            sed 's/^/    /' intermediate.pem
          } | kubectl apply -f -
          sleep 10
          test "$(kubectl get kmsissuer root-as-issuer -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')" != "True"

      - name: A certificate inside the permitted domains is issued
        run: |
          kubectl apply -f config/samples/certificate.yaml
          kubectl wait --for=condition=Ready certificate.cert-manager.io/example-internal --timeout=60s

      - name: The chain is leaf, constrained intermediate, pinned root
        run: |
          kubectl get secret example-internal-tls -o jsonpath='{.data.tls\.crt}' | base64 -d > chain.pem
          kubectl get secret example-internal-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > ca.pem
          test "$(grep -c 'BEGIN CERTIFICATE' chain.pem)" = 2
          cmp ca.pem root.pem
          openssl x509 -in intermediate.pem -noout -ext nameConstraints,basicConstraints
          openssl x509 -in intermediate.pem -noout -ext nameConstraints | grep -q "DNS:example.internal"
          openssl x509 -in intermediate.pem -noout -ext basicConstraints | grep -q "pathlen:0"
          openssl x509 -in root.pem -noout -ext basicConstraints | grep -q "pathlen:1"
          openssl verify -CAfile ca.pem -untrusted chain.pem chain.pem

      - name: A certificate outside the permitted domains is refused
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: outside
            namespace: default
          spec:
            secretName: outside-tls
            dnsNames: [accounts.google.com]
            issuerRef: {name: kms-issuer-sample, kind: KMSIssuer, group: cert-manager.skyscanner.net}
          EOF
          for _ in $(seq 1 30); do
            reason=$(kubectl get certificaterequest -n default -l "cert-manager.io/certificate-name=outside" \
              -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].reason}' 2>/dev/null || true)
            if [ "${reason}" = "Failed" ]; then echo "refused"; exit 0; fi
            sleep 2
          done
          kubectl describe certificaterequest -n default
          exit 1

      - name: KMSKey creates a key and schedules its deletion
        run: |
          kubectl apply -f config/samples/cert-manager_v1alpha1_kmskey.yaml
          kubectl wait --for=condition=Ready kmskey/kmskey-sample --timeout=60s
          key_id=$(kubectl get kmskey kmskey-sample -o jsonpath='{.status.keyId}')
          kubectl delete -f config/samples/cert-manager_v1alpha1_kmskey.yaml
          sleep 2
          state=$(aws --endpoint "${KMS}" kms describe-key --key-id "${key_id}" --region eu-west-1 --no-sign-request | jq -er '.KeyMetadata.KeyState')
          if [ "${state}" != "PendingDeletion" ]; then echo "key state ${state}, want PendingDeletion"; exit 1; fi

      - name: Logs of controller
        if: always()
        run: |
          echo "::group::Controller logs"
          kubectl logs deployment/kms-issuer -n kms-issuer-system --all-containers
          echo "::endgroup::"
