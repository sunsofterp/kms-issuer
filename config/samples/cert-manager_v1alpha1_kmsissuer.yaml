apiVersion: cert-manager.skyscanner.net/v1alpha1
kind: KMSIssuer
metadata:
  name: kms-issuer-sample
  namespace: default
spec:
  # A key ID or key ARN, never an alias; it must also be in the controller's
  # --allowed-key-ids, and this namespace in --allowed-issuer-namespaces.
  keyId: 00000000-0000-0000-0000-000000000000
  commonName: Example Root CA
  # The only names this CA may ever certify (written into it as name constraints).
  permittedDNSDomains:
    - example.internal
  duration: 87600h # 10 years
  renewBefore: 8760h # 1 year
  maxCertificateDuration: 2160h # 90 days
