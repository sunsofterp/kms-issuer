apiVersion: cert-manager.skyscanner.net/v1alpha1
kind: KMSIssuer
metadata:
  name: kms-issuer-sample
  namespace: default
spec:
  # The issuing KMS key: a key ID or key ARN, never an alias; it must also be in the
  # controller's --allowed-key-ids, and this namespace in --allowed-issuer-namespaces.
  keyId: 00000000-0000-0000-0000-000000000000
  # The only names this issuer certifies: inside its intermediate's name constraints
  # and the controller's --permitted-dns-domains.
  permittedDNSDomains:
    - example.internal
  maxCertificateDuration: 2160h # 90 days
  # Made by hand with `kms-ca intermediate`, signed by the root the controller pins
  # (--root-certificate). Replace it to renew.
  intermediateCertificate: |
    -----BEGIN CERTIFICATE-----
    (the PEM kms-ca wrote)
    -----END CERTIFICATE-----
