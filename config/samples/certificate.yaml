---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-internal
  namespace: default
spec:
  secretName: example-internal-tls
  duration: 720h # 30 days, within the controller's default --max-certificate-duration
  renewBefore: 240h # 10d
  isCA: false
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - server auth
  # DNS names inside the issuer's permittedDNSDomains only: no IP addresses, URIs or
  # email addresses, which the issuer refuses.
  dnsNames:
    - svc.example.internal
  issuerRef:
    name: kms-issuer-sample
    kind: KMSIssuer
    group: cert-manager.skyscanner.net
