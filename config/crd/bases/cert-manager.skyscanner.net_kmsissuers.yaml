---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: kmsissuers.cert-manager.skyscanner.net
spec:
  group: cert-manager.skyscanner.net
  names:
    kind: KMSIssuer
    listKind: KMSIssuerList
    plural: kmsissuers
    singular: kmsissuer
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KMSIssuer is the Schema for the kmsissuers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KMSIssuerSpec defines the desired state of KMSIssuer.
            properties:
              allowWildcards:
                description: |-
                  AllowWildcards lets a request include wildcard names (*.example.internal).
                  Off by default.
                type: boolean
              commonName:
                description: |-
                  CommonName is the CA certificate's subject common name. Immutable: devices that
                  trust the CA identify it by subject and key.
                maxLength: 64
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: commonName is immutable
                  rule: self == oldSelf
              duration:
                description: |-
                  Duration is the CA certificate's validity. Defaults to 87600h (10 years);
                  at least 24h.
                type: string
              keyId:
                description: |-
                  KeyID is the KMS key that signs: a key ID or key ARN, never an alias (an alias
                  can be re-pointed at another key by anyone allowed to update it). The key must
                  be an asymmetric SIGN_VERIFY key, and the controller must be started with it in
                  --allowed-key-ids. Immutable: a different key is a different CA.
                pattern: ^(arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/)?(mrk-)?[0-9a-fA-F-]{32,36}$
                type: string
                x-kubernetes-validations:
                - message: keyId is immutable
                  rule: self == oldSelf
              maxCertificateDuration:
                description: |-
                  MaxCertificateDuration is the longest validity a request may ask for. Requests
                  asking for longer are refused, not shortened. Issued certificates also never
                  outlive the CA certificate. Defaults to 2160h (90 days, cert-manager's default).
                type: string
              permittedDNSDomains:
                description: |-
                  PermittedDNSDomains are the DNS domains this CA may ever certify. They are
                  written into the CA certificate as critical name constraints (so clients reject
                  any certificate under it for another name, however it was issued), and every
                  request must name only these domains or their subdomains.
                items:
                  maxLength: 253
                  pattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)*[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                  type: string
                minItems: 1
                type: array
              renewBefore:
                description: |-
                  RenewBefore is how long before the CA certificate's notAfter a new CA
                  certificate (same key, same subject) is made. Certificates issued before and
                  after chain to either, so devices holding the older copy keep working until that
                  copy expires. Defaults to 8760h (1 year); must be shorter than duration.
                type: string
            required:
            - commonName
            - keyId
            - permittedDNSDomains
            type: object
            x-kubernetes-validations:
            - message: renewBefore must be shorter than duration
              rule: '!has(self.duration) || !has(self.renewBefore) || duration(self.renewBefore)
                < duration(self.duration)'
          status:
            description: KMSIssuerStatus defines the observed state of KMSIssuer
            properties:
              certificate:
                description: Byte slice containing a PEM encoded signed certificate
                  of the CA
                format: byte
                type: string
              conditions:
                items:
                  description: Condition contains condition information.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the timestamp corresponding to the last status
                        change of this condition.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        Message is a human readable description of the details of the last
                        transition, complementing reason.
                      type: string
                    reason:
                      description: |-
                        Reason is a brief machine readable explanation for the condition's last
                        transition.
                      type: string
                    status:
                      description: Status of the condition, one of ('True', 'False',
                        'Unknown').
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Type of the condition, currently ('Ready').
                      enum:
                      - Ready
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
