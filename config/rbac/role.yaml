---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - cert-manager.io
  resources:
  - certificaterequests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - certificaterequests/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - cert-manager.skyscanner.net
  resources:
  - kmsissuers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cert-manager.skyscanner.net
  resources:
  - kmsissuers/status
  - kmskeys/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - cert-manager.skyscanner.net
  resources:
  - kmskeys
  verbs:
  - get
  - list
  - update
  - watch
